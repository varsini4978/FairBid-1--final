<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Portal – FairBid</title>
  <link rel="stylesheet" href="css/fairbid.css">
  <script src="translations.js"></script>
  <script src="voice.js"></script>
  <style>
    .auth-container {
      max-width: 460px;
      margin: 2.5rem auto;
    }
    .hidden { display: none; }
    .msg-error {
      color: #D32F2F;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: block;
      font-weight: 600;
    }
    .msg-success {
      color: var(--primary);
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: block;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        FairBid
      </a>
      <nav class="nav-links">
        <a href="index.html" data-i18n="home">Home</a>
        <a href="buyer.html" data-i18n="buyerPortal">Buyer Portal</a>
        <a href="farmer_login.html" class="active" data-i18n="farmerPortal">Farmer Portal</a>
        <select id="fairbidLangSelect" class="lang-select" onchange="setLanguage(this.value)">
          <option value="en">English</option>
          <option value="ta">தமிழ்</option>
          <option value="hi">हिन्दी</option>
        </select>
      </nav>
    </div>
  </header>

  <main>
    <div class="auth-container">
      <div class="card" style="padding: 2.25rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <span class="badge badge-open" style="margin-bottom: 0.5rem;">Farmer Producer Portal</span>
          <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-primary);">
            Welcome, Producer
          </h1>
          <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.25rem;">
            Sign in to manage your crop lots and monitor live auctions
          </p>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs-nav" style="justify-content: center;">
          <button id="loginTabBtn" class="tab-button active" onclick="switchTab('login')">Sign In</button>
          <button id="registerTabBtn" class="tab-button" onclick="switchTab('register')">Register Farmer</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleFarmerLogin(event)">
          <div class="form-group">
            <label class="form-label" for="loginId">Farmer Unique ID or Mobile Number *</label>
            <input type="text" id="loginId" class="form-control" placeholder="e.g. F101 or 9876543210" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password *</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          </div>
          <span id="loginError" class="msg-error"></span>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
            Sign In to Dashboard →
          </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="hidden" onsubmit="handleFarmerRegister(event)">
          <div class="form-group">
            <label class="form-label" for="regFullName">Full Name / Farm Enterprise *</label>
            <input type="text" id="regFullName" class="form-control" placeholder="e.g. Ramesh Kumar / GreenFarms" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regFarmerId">Farmer ID or Mobile Number *</label>
            <input type="text" id="regFarmerId" class="form-control" placeholder="e.g. F101 or 9876543210" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regState">Operating State / Region *</label>
            <select id="regState" class="form-control" required>
              <option value="">-- Select State --</option>
              <option value="Tamil Nadu">Tamil Nadu</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Kerala">Kerala</option>
              <option value="Andhra Pradesh">Andhra Pradesh</option>
              <option value="Maharashtra">Maharashtra</option>
              <option value="Punjab">Punjab</option>
              <option value="Uttar Pradesh">Uttar Pradesh</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="regCrop">Primary Crop Grown *</label>
            <select id="regCrop" class="form-control" required>
              <option value="">-- Select Primary Crop --</option>
              <option value="Tomatoes">Tomatoes</option>
              <option value="Potatoes">Potatoes</option>
              <option value="Onions">Onions</option>
              <option value="Wheat">Wheat</option>
              <option value="Paddy/Rice">Paddy / Rice</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="regPassword">Create Password *</label>
            <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
          </div>
          <span id="regMessage" class="msg-error"></span>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
            Create Farmer Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border);">
          <a href="index.html" style="color: var(--text-muted); font-size: 0.85rem; text-decoration: none;">
            ← Back to Portal Selection
          </a>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <footer>
    <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
      <div><strong>FairBid</strong> – Farmer Authentication</div>
      <div>Java Servlets • MySQL • JDBC</div>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      const loginTabBtn = document.getElementById("loginTabBtn");
      const registerTabBtn = document.getElementById("registerTabBtn");
      const loginErr = document.getElementById("loginError");
      const regMsg = document.getElementById("regMessage");

      if (loginErr) loginErr.textContent = "";
      if (regMsg) { regMsg.textContent = ""; regMsg.className = "msg-error"; }

      if (tab === 'login') {
        loginForm.classList.remove("hidden");
        registerForm.classList.add("hidden");
        loginTabBtn.classList.add("active");
        registerTabBtn.classList.remove("active");
      } else {
        loginForm.classList.add("hidden");
        registerForm.classList.remove("hidden");
        registerTabBtn.classList.add("active");
        loginTabBtn.classList.remove("active");
      }
    }
  </script>
</body>
</html>

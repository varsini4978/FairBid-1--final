<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Produce Auctions – FairBid</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        FairBid
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="browse-produce.html" class="active">Live Auctions</a>
        <div id="nav-user-slot" style="display: flex; align-items: center; gap: 0.75rem;"></div>
      </nav>
    </div>
  </header>

  <main>
    <div style="margin-bottom: 2rem;">
      <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-primary);">
        Live Produce Auctions & Marketplace
      </h1>
      <p style="color: var(--text-secondary); font-size: 0.95rem;">
        Discover farm-fresh agricultural lots listed directly by farmers across India.
      </p>
    </div>

    <!-- Search & Filter Controls -->
    <div class="card" style="padding: 1.25rem; margin-bottom: 2rem;">
      <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
        <div style="flex: 1; min-width: 250px;">
          <input type="text" id="search-input" class="form-control" placeholder="Search by crop name or location (e.g. Tomatoes, Thanjavur)...">
        </div>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;" id="category-pills">
          <button class="btn btn-primary btn-sm category-btn" data-category="ALL">All Categories</button>
          <button class="btn btn-secondary btn-sm category-btn" data-category="Vegetables">Vegetables</button>
          <button class="btn btn-secondary btn-sm category-btn" data-category="Fruits">Fruits</button>
          <button class="btn btn-secondary btn-sm category-btn" data-category="Grains">Grains</button>
          <button class="btn btn-secondary btn-sm category-btn" data-category="Pulses">Pulses</button>
          <button class="btn btn-secondary btn-sm category-btn" data-category="Spices">Spices</button>
        </div>
      </div>
    </div>

    <!-- Produce & Auctions Grid -->
    <div id="browse-grid" class="grid-3">
      <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">
        Loading produce lots and active auctions...
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/browse-produce.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Registration – FairBid</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        FairBid
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="farmer-login.html">Already Registered? Sign In</a>
      </nav>
    </div>
  </header>

  <main style="max-width: 650px; padding-top: 2rem;">
    <div class="card" style="padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="badge badge-open" style="margin-bottom: 0.75rem;">Farmer Registration</span>
        <h1 style="font-size: 1.75rem; font-weight: 800;">Join as a Producer</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.35rem;">
          Directly reach verified buyers with guaranteed reserve pricing
        </p>
      </div>

      <form id="farmer-register-form">
        <input type="hidden" id="role" value="FARMER">

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="fullName">Full Name *</label>
            <input type="text" id="fullName" class="form-control" placeholder="e.g. Ramesh Kumar" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="e.g. ramesh@fairbid.com" required>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="password">Password * (min 8 chars, 1 letter, 1 number)</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number (10 digits) *</label>
            <input type="tel" id="phone" class="form-control" placeholder="e.g. 9876543210" required>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="farmName">Farm / Organization Name *</label>
            <input type="text" id="farmName" class="form-control" placeholder="e.g. Green Valley Organics" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="location">Location / State *</label>
            <input type="text" id="location" class="form-control" placeholder="e.g. Thanjavur, Tamil Nadu" required>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="village">Village / Taluk</label>
            <input type="text" id="village" class="form-control" placeholder="e.g. Papanasam">
          </div>
          <div class="form-group">
            <label class="form-label" for="district">District</label>
            <input type="text" id="district" class="form-control" placeholder="e.g. Thanjavur">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;" id="reg-submit">
          Create Farmer Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Already have a Farmer account? <a href="farmer-login.html" style="color: var(--primary); font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>

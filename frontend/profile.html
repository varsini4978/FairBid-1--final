<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile – FairBid</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        FairBid
      </a>
      <nav class="nav-links">
        <span id="nav-dashboard-link"></span>
        <span id="nav-user-slot"></span>
      </nav>
    </div>
  </header>

  <main style="max-width: 650px; padding-top: 2rem;">
    <!-- Loading State -->
    <div id="loading" class="card" style="text-align: center; padding: 3rem;">
      <div style="font-size: 2.5rem; margin-bottom: 1rem;">⏳</div>
      <p style="color: var(--text-secondary);">Loading your profile information...</p>
    </div>

    <!-- Profile Card Container -->
    <div id="profile-container" style="display: none;">
      <div class="card" style="padding: 2.25rem;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
          <div>
            <span id="role-badge" class="badge badge-open" style="margin-bottom: 0.5rem;"></span>
            <h1 id="profile-title" style="font-size: 1.75rem; font-weight: 800;">My Profile</h1>
            <p id="profile-summary-text" style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.25rem;"></p>
          </div>
        </div>

        <form id="profile-form">
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="profile-fullName">Full Name *</label>
              <input type="text" id="profile-fullName" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="profile-email">Email Address</label>
              <input type="email" id="profile-email" class="form-control" disabled style="background: #F1F5F9; cursor: not-allowed;">
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="profile-phone">Phone Number *</label>
              <input type="tel" id="profile-phone" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="profile-location">Location / State</label>
              <input type="text" id="profile-location" class="form-control">
            </div>
          </div>

          <!-- Role-Specific Fields (Injected by JS) -->
          <div id="role-fields"></div>

          <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
            <a id="cancel-profile-btn" href="#" class="btn btn-secondary">Back to Dashboard</a>
            <button type="submit" class="btn btn-primary" id="save-profile-btn">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsold Produce Recovery – FairBid</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        FairBid
      </a>
      <nav class="nav-links">
        <a href="farmer-dashboard.html">Farmer Dashboard</a>
        <a href="browse-produce.html">Live Auctions</a>
        <span id="nav-user-slot"></span>
      </nav>
    </div>
  </header>

  <main style="max-width: 800px; padding-top: 2rem;">
    <!-- Loading State -->
    <div id="loading" class="card" style="text-align: center; padding: 3rem;">
      <div style="font-size: 2.5rem; margin-bottom: 1rem;">⏳</div>
      <p style="color: var(--text-secondary);">Loading unsold produce lot details & recovery options...</p>
    </div>

    <!-- Recovery Container -->
    <div id="recovery-container" style="display: none;"></div>
  </main>

  <!-- Revise Price Modal -->
  <div id="revise-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 450px;">
      <h3 style="margin-bottom: 0.5rem;">Revise Minimum Reserve Price</h3>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.25rem;">
        Enter a revised minimum acceptable price per unit. A new auction round will be initiated immediately.
      </p>

      <form id="revise-price-form">
        <div class="form-group">
          <label class="form-label" for="new-min-price">New Minimum Price (₹ per unit) *</label>
          <input type="number" id="new-min-price" class="form-control" step="0.50" min="0.50" required placeholder="e.g. 22.00">
        </div>

        <div class="form-group">
          <label class="form-label" for="revise-closing-time">Auction Closing Date & Time (Optional)</label>
          <input type="datetime-local" id="revise-closing-time" class="form-control">
          <small style="color: var(--text-muted); font-size: 0.8rem;">Defaults to 24 hours from now if left empty</small>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" id="cancel-revise-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submit-revise-btn">Confirm & Launch Round</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/unsold-recovery.js"></script>
</body>
</html>
